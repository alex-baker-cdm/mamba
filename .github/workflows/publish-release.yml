name: Publish Release
on:
  push:
    branches:
      - 'main'
      - 'main_1.x'

permissions:
  contents: read

jobs:
  get-version:
    name: Get version for release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        run: echo "version=`cat ./mambaSharedFramework/Resources/version.txt`" >> "$GITHUB_OUTPUT"

  publish-release:
    name: Publish release ${{ needs.get-version.outputs.version }}
    runs-on: ubuntu-latest
    needs: get-version
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create release
        uses: elgohr/Github-Release-Action@c5ea99036abb741a89f8bf1f2cd7fba845e3313a # v5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: ${{ needs.get-version.outputs.version }}
          tag: ${{ needs.get-version.outputs.version }}
